[project]
name = "lecture-companion"
version = "0.1.0"
description = "Turns lecture slides into a per-course plain-language textbook."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    "httpx>=0.27",
    "pypdfium2>=4.30",
    "pypdf>=5.0",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "Pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "dill>=0.3.9",
]

[project.optional-dependencies]
# Local retrieval model. Heavy (pulls torch); the app falls back to a
# deterministic hashing embedder when this is not installed.
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "reportlab>=4.2", "playwright>=1.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
